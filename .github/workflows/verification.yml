name: formal-verification
on: [workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - run: python scripts/bootstrap_tools.py
      - run: python scripts/reproduce.py spec-check
      - run: python scripts/reproduce.py models --profile core
      - run: python scripts/reproduce.py mutations
      - run: docker build -f environment/Dockerfile.proofs -t vgc-tlaps:local .
      # Intentionally fails while central obligations remain incomplete.
      - run: python scripts/reproduce.py proofs --timeout 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: formal-evidence
          path: results/raw
